appId: com.ibrahim1774.littleechoes
env:
  EMAIL: ${EMAIL}
---
# Signed-out device: ask for a reset email. The link in it is opened by 10-reset-password-link.yaml.
- runFlow:
    file: _launch.yaml
    env:
      TIER_INDEX: 2
- tapOn:
    id: 'onboarding-signin'
- tapOn:
    id: 'signin-forgot-password'
- assertVisible:
    id: 'signin-error'
- takeScreenshot: e2e/shots/90-forgot-needs-email
- tapOn:
    id: 'signin-email'
- inputText: ${EMAIL}
- tapOn:
    id: 'signin-forgot-password'
- extendedWaitUntil:
    visible:
      id: 'signin-reset-sent'
    timeout: 15000
- takeScreenshot: e2e/shots/91-forgot-sent
