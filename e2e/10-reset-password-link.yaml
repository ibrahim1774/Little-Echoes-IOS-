appId: com.ibrahim1774.littleechoes
env:
  LINK: ${LINK}
  EMAIL: ${EMAIL}
  NEW_PASSWORD: ${NEW_PASSWORD}
---
# Open the reset email's link (LINK = littleechoes://reset-password?code=…) on the device
# that requested it, set a new password, and land in the app signed in.
- openLink: ${LINK}
- runFlow:
    when:
      visible: 'Open in .*Little Echoes.*'
    commands:
      - tapOn: 'Open'
- extendedWaitUntil:
    visible:
      id: 'reset-email'
    timeout: 15000
- assertVisible: 'for ${EMAIL}'
- takeScreenshot: e2e/shots/92-reset-form
- tapOn:
    id: 'reset-password'
- inputText: ${NEW_PASSWORD}
- tapOn:
    id: 'reset-confirm'
- inputText: 'does-not-match'
- tapOn:
    id: 'reset-submit'
- assertVisible: "The passwords don't match."
- tapOn:
    id: 'reset-confirm'
- eraseText
- inputText: ${NEW_PASSWORD}
- tapOn:
    id: 'reset-submit'
- extendedWaitUntil:
    visible: 'Not Now'
    timeout: 20000
    optional: true
- tapOn:
    text: 'Not Now'
    optional: true
# The test account has no family profile yet, so a signed-in user lands on setup.
- extendedWaitUntil:
    visible:
      id: 'parent-name'
    timeout: 20000
- takeScreenshot: e2e/shots/93-reset-done-signed-in
