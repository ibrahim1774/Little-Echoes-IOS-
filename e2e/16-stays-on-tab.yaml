appId: com.ibrahim1774.littleechoes
env:
  EMAIL: ${EMAIL}
  PASSWORD: ${PASSWORD}
---
# A subscriber who signs in and opens Memories stays there: background subscription checks
# never bounce them to the paywall or back to Home.
- runFlow:
    file: _launch.yaml
    env:
      TIER_INDEX: 1
- tapOn:
    id: 'onboarding-signin'
- tapOn:
    id: 'signin-email'
- inputText: ${EMAIL}
- tapOn:
    id: 'signin-password'
- inputText: ${PASSWORD}
- pressKey: Enter
- tapOn:
    id: 'signin-submit'
- tapOn:
    text: 'Not Now'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'home-greeting'
    timeout: 30000
- runFlow: _dismiss-superwall-panel.yaml
- tapOn:
    id: 'tab-memories'
- runFlow: _memories-reset.yaml
- repeat:
    times: 12
    commands:
      - waitForAnimationToEnd:
          timeout: 5000
      - assertVisible:
          id: 'memories-timeline'
