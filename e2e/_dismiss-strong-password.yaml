appId: com.ibrahim1774.littleechoes
---
# iOS offers to generate a password on sign-up. The sheet is a system overlay
# that the test can't see, so close it blind (the point is empty space on the
# sign-up screen when the sheet isn't showing), then refocus the field.
- waitForAnimationToEnd:
    timeout: 2500
- tapOn:
    point: '91%,58%'
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: 'signup-password'
