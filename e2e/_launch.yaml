appId: com.ibrahim1774.littleechoes
env:
  TIER_INDEX: ${TIER_INDEX}
---
# Open the development build against the local Metro server and choose the
# subscription state in Superwall's test-mode panel.
# TIER_INDEX: 0 = basic subscribed, 1 = pro subscribed, anything else = unsubscribed.
- stopApp
# The app's own scheme; the exp+ scheme is also claimed by Expo Go.
- openLink: 'littleechoes://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081'
# iOS confirms before following a link into an app.
- runFlow:
    when:
      visible: 'Open in .*Little Echoes.*'
    commands:
      - tapOn: 'Open'
- runFlow: _dismiss-apple-account.yaml
- assertVisible: 'Starting Entitlements'
- tapOn: 'Reset to Defaults'
- runFlow:
    when:
      true: ${TIER_INDEX == 0 || TIER_INDEX == 1}
    commands:
      - tapOn:
          text: 'Inactive.*'
          index: ${TIER_INDEX}
      - tapOn: 'Subscribed'
- tapOn:
    text: 'Cancel'
    optional: true
- tapOn: 'OK'
- waitForAnimationToEnd:
    timeout: 5000
