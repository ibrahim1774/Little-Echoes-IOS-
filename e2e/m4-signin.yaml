appId: com.ibrahim1774.littleechoes
env:
  EMAIL: ${EMAIL}
  PASSWORD: ${PASSWORD}
---
# Marketing screenshots helper: sign in as a Pro test-mode subscriber.
- runFlow:
    file: _launch.yaml
    env:
      TIER_INDEX: 1
- tapOn:
    id: 'onboarding-signin'
- tapOn:
    id: 'signin-email'
- inputText: ${EMAIL}
- tapOn:
    id: 'signin-password'
- inputText: ${PASSWORD}
- pressKey: Enter
- tapOn:
    id: 'signin-submit'
- extendedWaitUntil:
    visible: 'Not Now'
    timeout: 20000
    optional: true
- tapOn:
    text: 'Not Now'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'home-greeting'
    timeout: 40000
